<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Chat Widget</title>
    <style>
        #chat-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            font-family: Arial, sans-serif;
        }
        .chat-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            color: #111;
            border: 2px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .chat-btn:hover { transform: scale(1.1); }
        .chat-window {
            display: none;
            width: 320px;
            height: 450px;
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            flex-direction: column;
            overflow: hidden;
            position: absolute;
            bottom: 75px;
            right: 0;
            border: 1px solid #444;
        }
        .chat-window.open { display: flex; }
        .header {
            background-color: #2c2c2c;
            padding: 12px 15px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h3 { margin: 0; font-size: 16px; color: #f1c40f; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 22px; cursor: pointer; }
        .messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }
        .bot-message { background-color: #333; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-message { background-color: #f1c40f; color: #111; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: bold; }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #2c2c2c;
            border-top: 1px solid #444;
        }
        .input-area input {
            flex: 1;
            padding: 9px;
            border-radius: 20px;
            border: 1px solid #555;
            background-color: #121212;
            color: white;
            outline: none;
        }
        .input-area button {
            margin-left: 6px;
            padding: 0 14px;
            border-radius: 20px;
            border: none;
            background-color: #f1c40f;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="chat-widget-container">
    <!-- Icono de ficha de casino / moneda -->
    <button class="chat-btn" id="chatBtn">🪙</button>
    
    <div class="chat-window" id="chatWindow">
        <div class="header">
            <h3>🎰 Soporte Casino</h3>
            <button class="close-btn" id="closeBtn">×</button>
        </div>
        <div class="messages" id="messages">
            <div class="message bot-message">¡Hola! ¿En qué puedo ayudarte hoy en el casino?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe un mensaje...">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>
</div>

<script>
    // Referencias directas y seguras
    const chatBtn = document.getElementById('chatBtn');
    const chatWindow = document.getElementById('chatWindow');
    const closeBtn = document.getElementById('closeBtn');
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Abrir y cerrar ventana de forma garantizada
    chatBtn.onclick = function() {
        chatWindow.classList.toggle('open');
    };

    closeBtn.onclick = function() {
        chatWindow.classList.remove('open');
    };

    // Enviar mensaje de prueba funcional inmediatamente
    sendBtn.onclick = sendMessage;
    userInput.onkeypress = function(e) {
        if (e.key === 'Enter') sendMessage();
    };

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Mostrar mensaje del usuario
        appendMessage(text, 'user-message');
        userInput.value = '';

        // Simular respuesta automática o conectar con tu IA de Groq aquí
        setTimeout(() => {
            appendMessage("Recibido. Para respuestas de IA en vivo, recuerda colocar tu API Key de Groq en el código.", 'bot-message');
        }, 500);
    }

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }
</script>

</body>
</html>
