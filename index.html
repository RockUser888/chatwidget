<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Casino</title>
    <style>
        /* Estilos básicos de tu widget flotante */
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        #chat-container { width: 350px; background: #1a1a1a; color: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; }
        #chat-header { background: #2a2a2a; padding: 12px; font-weight: bold; color: #ffcc00; display: flex; justify-content: space-between; align-items: center; }
        #chat-messages { height: 300px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user-msg { background: #ffcc00; color: #000; align-self: flex-end; }
        .bot-msg { background: #333; color: #fff; align-self: flex-start; }
        #chat-input-area { display: flex; padding: 10px; background: #222; border-top: 1px solid #333; }
        #chat-input { flex: 1; padding: 8px; border: none; border-radius: 4px; outline: none; background: #333; color: #fff; }
        #chat-send { background: #ffcc00; border: none; padding: 8px 12px; margin-left: 6px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }
        .ticket-btn { background: #e74c3c; color: #fff; border: none; padding: 6px 10px; margin-top: 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <span>🪙 Soporte ClassicGames</span>
    </div>
    <div id="chat-messages">
        <div class="message bot-msg">¡Hola! ¿En qué puedo ayudarte hoy en classicgames.bet?</div>
    </div>
    <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Escribe tu consulta...">
        <button id="chat-send" onclick="enviarMensaje()">Enviar</button>
    </div>
</div>

<script>
    const GROQ_API_KEY = "TU_GROQ_API_KEY"; // Reemplaza con tu Key real de Groq

    async function enviarMensaje() {
        const inputField = document.getElementById('chat-input');
        const mensajeTexto = inputField.value.trim();
        if (!mensajeTexto) return;

        agregarMensaje(mensajeTexto, 'user-msg');
        inputField.value = '';

        // Indicador de escribiendo...
        const idCarga = agregarMensaje('Pensando...', 'bot-msg');

        try {
            const respuestaIA = await consultarGroq(mensajeTexto);
            actualizarMensaje(idCarga, respuestaIA);
        } catch (error) {
            actualizarMensaje(idCarga, 'Lo siento, hubo un error de conexión. ¿Deseas generar un ticket de soporte humano?');
            mostrarBotonTicket();
        }
    }

    function agregarMensaje(texto, clase) {
        const messagesDiv = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${clase}`;
        msgDiv.innerText = texto;
        const id = 'msg_' + Date.now();
        msgDiv.id = id;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return id;
    }

    function actualizarMensaje(id, texto) {
        const msgDiv = document.getElementById(id);
        if (msgDiv) msgDiv.innerText = texto;
    }

    async function consultarGroq(mensaje) {
        const systemPrompt = `
        Eres el asistente de soporte oficial y exclusivo de classicgames.bet. 
        Tu único objetivo es ayudar con información sobre juegos, bonos, depósitos y retiros en classicgames.bet.
        REGLAS:
        1. Si te consultan sobre temas ajenos al casino, responde amablemente que solo atiendes consultas de classicgames.bet.
        2. Si no sabes la respuesta o el usuario necesita ayuda técnica avanzada, indícale amablemente que puede generar un ticket de soporte humano.
        `;

        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${GROQ_API_KEY}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: 'llama3-70b-8192',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: mensaje }
                ]
            })
        });

        const data = await response.json();
        return data.choices[0].message.content;
    }

    function mostrarBotonTicket() {
        const messagesDiv = document.getElementById('chat-messages');
        const btn = document.createElement('button');
        btn.className = 'ticket-btn';
        btn.innerText = '🎫 Generar Ticket Humano';
        btn.onclick = () => {
            alert('Ticket generado con éxito. Un agente se comunicará contigo.');
            btn.remove();
        };
        messagesDiv.appendChild(btn);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
