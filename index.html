<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Soporte ClassicGames</title>

  <style>
    :root {
      --yellow: #ffcc00;
      --dark: #171717;
      --dark2: #222222;
      --dark3: #303030;
      --text: #ffffff;
      --muted: #a9a9a9;
      --red: #e74c3c;
      --border: #3a3a3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
    }

    /* =========================
       BOTÓN FLOTANTE
       ========================= */

    #chat-button {
      position: fixed;
      right: 20px;
      bottom: 20px;

      width: 60px;
      height: 60px;

      border: none;
      border-radius: 50%;

      background: var(--yellow);
      color: #000;

      font-size: 26px;
      cursor: pointer;

      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.35);

      z-index: 999999;
    }

    #chat-button:hover {
      transform: scale(1.04);
    }

    /* =========================
       CONTENEDOR DEL CHAT
       ========================= */

    #chat-container {
      position: fixed;

      right: 20px;
      bottom: 95px;

      width: 380px;
      max-width: calc(100vw - 30px);

      height: 560px;
      max-height: calc(100vh - 120px);

      background: var(--dark);

      color: var(--text);

      border-radius: 14px;

      overflow: hidden;

      display: none;
      flex-direction: column;

      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.55);

      z-index: 999998;
    }

    /* =========================
       CABECERA
       ========================= */

    #chat-header {
      background: var(--dark2);

      padding: 14px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);
    }

    #chat-title {
      color: var(--yellow);
      font-weight: bold;
      font-size: 16px;
    }

    #chat-close {
      background: transparent;
      border: none;

      color: white;

      font-size: 23px;

      cursor: pointer;
    }

    /* =========================
       MENSAJES
       ========================= */

    #chat-messages {
      flex: 1;

      padding: 14px;

      overflow-y: auto;

      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .message {
      max-width: 84%;

      padding: 10px 13px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.45;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .bot-msg {
      align-self: flex-start;

      background: var(--dark3);

      color: white;
    }

    .user-msg {
      align-self: flex-end;

      background: var(--yellow);

      color: black;
    }

    .system-msg {
      align-self: center;

      color: var(--muted);

      font-size: 12px;

      text-align: center;
    }

    .typing {
      opacity: 0.65;
      font-style: italic;
    }

    /* =========================
       TICKET
       ========================= */

    #ticket-area {
      padding: 0 12px 10px;
    }

    #ticket-button {
      width: 100%;

      padding: 10px;

      border: none;

      border-radius: 7px;

      background: var(--red);

      color: white;

      font-size: 13px;

      font-weight: bold;

      cursor: pointer;
    }

    #ticket-button:hover {
      filter: brightness(1.08);
    }

    #ticket-form {
      display: none;

      padding: 12px;

      background: #202020;

      border-top: 1px solid var(--border);
    }

    #ticket-form input,
    #ticket-form textarea {
      width: 100%;

      margin-bottom: 8px;

      padding: 9px;

      border: 1px solid #444;

      border-radius: 6px;

      background: #303030;

      color: white;

      outline: none;

      font-family: inherit;
    }

    #ticket-form textarea {
      min-height: 90px;

      resize: vertical;
    }

    #ticket-submit {
      width: 100%;

      padding: 10px;

      border: none;

      border-radius: 7px;

      background: var(--yellow);

      color: black;

      font-weight: bold;

      cursor: pointer;
    }

    #ticket-submit:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }

    /* =========================
       INPUT DEL CHAT
       ========================= */

    #chat-input-area {
      display: flex;

      padding: 10px;

      background: #202020;

      border-top: 1px solid var(--border);
    }

    #chat-input {
      flex: 1;

      min-width: 0;

      padding: 10px;

      border: none;

      outline: none;

      border-radius: 6px;

      background: var(--dark3);

      color: white;

      font-size: 14px;
    }

    #chat-send {
      margin-left: 7px;

      padding: 0 14px;

      border: none;

      border-radius: 6px;

      background: var(--yellow);

      color: black;

      font-weight: bold;

      cursor: pointer;
    }

    #chat-send:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      #chat-container {
        right: 10px;
        bottom: 80px;

        width: calc(100vw - 20px);

        height: calc(100vh - 100px);
      }

      #chat-button {
        right: 15px;
        bottom: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       BOTÓN FLOTANTE
       ========================= -->

  <button
    id="chat-button"
    type="button"
    aria-label="Abrir soporte"
  >
    💬
  </button>


  <!-- =========================
       CHAT
       ========================= -->

  <div id="chat-container">

    <!-- HEADER -->

    <div id="chat-header">

      <span id="chat-title">
        🪙 Soporte ClassicGames
      </span>

      <button
        id="chat-close"
        type="button"
        aria-label="Cerrar chat"
      >
        ×
      </button>

    </div>


    <!-- MENSAJES -->

    <div id="chat-messages">

      <div class="message bot-msg">
        ¡Hola! 👋 Soy el asistente de soporte de ClassicGames.

        ¿En qué puedo ayudarte?
      </div>

      <div class="message system-msg">
        Podés crear un ticket de soporte humano en cualquier momento.
      </div>

    </div>


    <!-- =========================
         TICKET
         ========================= -->

    <div id="ticket-area">

      <button
        id="ticket-button"
        type="button"
      >
        🎫 Crear ticket de soporte
      </button>

    </div>


    <!-- FORMULARIO DEL TICKET -->

    <div id="ticket-form">

      <input
        id="ticket-name"
        type="text"
        placeholder="Nombre"
        autocomplete="name"
      >

      <input
        id="ticket-email"
        type="email"
        placeholder="Correo electrónico"
        autocomplete="email"
      >

      <textarea
        id="ticket-message"
        placeholder="Contanos cuál es el problema..."
      ></textarea>

      <button
        id="ticket-submit"
        type="button"
      >
        Enviar ticket
      </button>

    </div>


    <!-- =========================
         INPUT CHAT
         ========================= -->

    <div id="chat-input-area">

      <input
        id="chat-input"
        type="text"
        placeholder="Escribí tu consulta..."
        autocomplete="off"
      >

      <button
        id="chat-send"
        type="button"
      >
        Enviar
      </button>

    </div>

  </div>


  <script>

    /*
     * ==========================================================
     * IMPORTANTE
     * ==========================================================
     *
     * Acá va SOLO la URL pública de tu Edge Function.
     *
     * NO pongas:
     * - GROQ_API_KEY
     * - contraseñas
     * - tokens
     *
     * Ejemplo:
     *
     * https://abcdefgh.supabase.co/functions/v1/chat
     *
     */

    const CHAT_API_URL =
      "https://TU-PROYECTO.supabase.co/functions/v1/chat";


    /* ==========================================================
       ELEMENTOS
       ========================================================== */

    const chatButton =
      document.getElementById("chat-button");

    const chatContainer =
      document.getElementById("chat-container");

    const chatClose =
      document.getElementById("chat-close");

    const chatMessages =
      document.getElementById("chat-messages");

    const chatInput =
      document.getElementById("chat-input");

    const chatSend =
      document.getElementById("chat-send");

    const ticketButton =
      document.getElementById("ticket-button");

    const ticketForm =
      document.getElementById("ticket-form");

    const ticketSubmit =
      document.getElementById("ticket-submit");


    /* ==========================================================
       ABRIR CHAT
       ========================================================== */

    chatButton.addEventListener(
      "click",
      function () {

        chatContainer.style.display =
          "flex";

        chatInput.focus();

      }
    );


    /* ==========================================================
       CERRAR CHAT
       ========================================================== */

    chatClose.addEventListener(
      "click",
      function () {

        chatContainer.style.display =
          "none";

      }
    );


    /* ==========================================================
       AGREGAR MENSAJE
       ========================================================== */

    function agregarMensaje(
      texto,
      tipo
    ) {

      const div =
        document.createElement("div");

      div.className =
        "message " + tipo;

      div.textContent =
        texto;

      chatMessages.appendChild(div);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

      return div;

    }


    /* ==========================================================
       CONSULTAR IA
       ========================================================== */

    async function consultarIA(
      mensaje
    ) {

      const response =
        await fetch(
          CHAT_API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              message: mensaje,

              language: "es"

            })

          }
        );


      let data;

      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "El servidor devolvió una respuesta inválida."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Error del servidor."
        );

      }


      return data.reply;

    }


    /* ==========================================================
       ENVIAR MENSAJE
       ========================================================== */

    async function enviarMensaje() {

      const mensaje =
        chatInput.value.trim();


      if (!mensaje) {
        return;
      }


      /* Mostrar mensaje del usuario */

      agregarMensaje(
        mensaje,
        "user-msg"
      );


      /* Limpiar input */

      chatInput.value =
        "";


      /* Desactivar botón */

      chatSend.disabled =
        true;


      /* Mostrar "Pensando..." */

      const pensando =
        agregarMensaje(
          "Pensando...",
          "bot-msg"
        );

      pensando.classList.add(
        "typing"
      );


      try {

        const respuesta =
          await consultarIA(
            mensaje
          );


        pensando.textContent =
          respuesta;

        pensando.classList.remove(
          "typing"
        );

      }

      catch (error) {

        console.error(
          "Error IA:",
          error
        );


        pensando.textContent =
          "No pude conectarme con el asistente en este momento. Podés crear un ticket para contactar al soporte humano.";

        pensando.classList.remove(
          "typing"
        );

      }


      finally {

        chatSend.disabled =
          false;

        chatInput.focus();

      }

    }


    /* ==========================================================
       CLICK EN ENVIAR
       ========================================================== */

    chatSend.addEventListener(
      "click",
      enviarMensaje
    );


    /* ==========================================================
       ENTER
       ========================================================== */

    chatInput.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          enviarMensaje();

        }

      }
    );


    /* ==========================================================
       MOSTRAR / OCULTAR FORMULARIO DE TICKET
       ========================================================== */

    ticketButton.addEventListener(
      "click",
      function () {

        if (
          ticketForm.style.display === "block"
        ) {

          ticketForm.style.display =
            "none";

        } else {

          ticketForm.style.display =
            "block";

        }

      }
    );


    /* ==========================================================
       ENVIAR TICKET
       ========================================================== */

    ticketSubmit.addEventListener(
      "click",
      async function () {

        const name =
          document
            .getElementById(
              "ticket-name"
            )
            .value
            .trim();


        const email =
          document
            .getElementById(
              "ticket-email"
            )
            .value
            .trim();


        const message =
          document
            .getElementById(
              "ticket-message"
            )
            .value
            .trim();


        /* Validación básica */

        if (
          !name ||
          !email ||
          !message
        ) {

          alert(
            "Completá nombre, correo y descripción del problema."
          );

          return;

        }


        /* Desactivar botón */

        ticketSubmit.disabled =
          true;

        ticketSubmit.textContent =
          "Enviando...";


        try {

          const response =
            await fetch(
              CHAT_API_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  action: "ticket",

                  name: name,

                  email: email,

                  message: message

                })

              }
            );


          let data;

          try {

            data =
              await response.json();

          } catch {

            throw new Error(
              "Respuesta inválida del servidor."
            );

          }


          if (!response.ok) {

            throw new Error(
              data.error ||
              "No se pudo crear el ticket."
            );

          }


          agregarMensaje(
            "✅ Tu ticket fue enviado correctamente. Nuestro equipo de soporte lo revisará.",
            "bot-msg"
          );


          /* Limpiar formulario */

          document
            .getElementById(
              "ticket-name"
            )
            .value = "";


          document
            .getElementById(
              "ticket-email"
            )
            .value = "";


          document
            .getElementById(
              "ticket-message"
            )
            .value = "";


          ticketForm.style.display =
            "none";

        }

        catch (error) {

          console.error(
            "Error ticket:",
            error
          );


          alert(
            "No se pudo enviar el ticket. Intentá nuevamente."
          );

        }


        finally {

          ticketSubmit.disabled =
            false;

          ticketSubmit.textContent =
            "Enviar ticket";

        }

      }
    );

  </script>

</body>
</html>
