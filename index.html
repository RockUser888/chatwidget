<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente IA</title>
    <style>
        body {
            font-family: 'Work Sans', sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-window {
            width: 350px;
            height: 600px;
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background-color: #2c2c2c;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .bot-message {
            background-color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .user-message {
            background-color: #007bff;
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #2c2c2c;
            border-top: 1px solid #333;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #444;
            background-color: #121212;
            color: white;
            outline: none;
        }
        button {
            margin-left: 10px;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-window">
    <div class="header">Asistente IA</div>
    <div class="messages" id="messages">
        <!-- Los mensajes aparecerán aquí -->
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<!-- Cargar Supabase desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. INICIALIZACIÓN SEGURA
    // Estas variables se llenarán con build.js
    const supabaseUrl = 'https://nreuqpkejcidfeawczdl.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZXVxcGtlamNpZGZlYXdjemRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MjY1NDUsImV4cCI6MjEwNDQwMjU0NX0.MctdVtGCBgEjdrMs-bQ7XRwT2xNsPQxtBOOFFa8aJow';
    const GROQ_API_KEY = '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';

    // Verificar si las variables fueron reemplazadas
    if (supabaseUrl === 'TU_URL_DE_SUPABASE' || GROQ_API_KEY === 'TU_API_KEY_DE_GROQ') {
        console.warn("⚠️ Las variables de entorno no se inyectaron correctamente. Revisa build.js");
    }

    const { createClient } = window.supabase;
    const supabase = createClient(supabaseUrl, supabaseKey);

    const messagesContainer = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // 2. EVENTOS DE ENVÍO
    sendBtn.addEventListener('click', sendMessage);
    
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault(); // Evita recargas extrañas
            sendMessage();
        }
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // UI Update
        addMessage(text, 'user');
        userInput.value = '';
        sendBtn.disabled = true; // Bloquear botón mientras carga

        try {
            // 3. OBTENER HISTORIAL
            let context = "";
            try {
                const { data: history } = await supabase
                    .from('chats')
                    .select('message')
                    .order('id', { ascending: false })
                    .limit(5); // Limitar a 5 para no saturar el prompt
                
                if (history) {
                    context = history.map(msg => msg.message).reverse().join('\n');
                }
            } catch (err) {
                console.warn("Error obteniendo historial:", err);
            }

            // 4. LLAMADA A GROQ
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'llama-3.1-8b-instant',
                    messages: [
                        { role: 'system', content: 'Eres un asistente útil y conciso para el casino.' },
                        ...(context ? [{ role: 'user', content: `Historial reciente:\n${context}\n\nUsuario: ${text}` }] : [{ role: 'user', content: text }])
                    ]
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;

            addMessage(reply, 'bot');

            // 5. GUARDAR EN SUPABASE
            try {
                await supabase.from('chats').insert([
                    { message: text },
                    { message: reply }
                ]);
            } catch (dbErr) {
                console.warn("Error guardando en DB:", dbErr);
            }

        } catch (error) {
            console.error("Error general:", error);
            addMessage("Error de conexión. Verifica la consola.", "bot");
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}-message`;
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
</script>

</body>
</html>
